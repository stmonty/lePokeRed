[project]
name = "lepokered"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "einops>=0.8.2",
    "h5py>=3.16.0",
    "mlflow>=3.14.0",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "pyboy>=2.7.0",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poke"]
